name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        timeout-minutes: 10
        with:
          go-version-file: go.mod

      - name: Download modules
        timeout-minutes: 10
        run: go mod download

      # The remux test skips without ffmpeg; CI should run it.
      # A stalled Ubuntu mirror once hung apt past the step timeout; short timeouts with retries move on to another try.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          opts="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $opts update
          sudo apt-get $opts install -y --no-install-recommends ffmpeg

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::unformatted files:"; echo "$out"; exit 1; fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  # Lint and govulncheck don't wait for the tests: a runner of their own.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        timeout-minutes: 10
        with:
          go-version-file: go.mod

      - name: Download modules
        timeout-minutes: 10
        run: go mod download

      # Keep the version equal to the Makefile's: a new release brings new findings unasked.
      - name: golangci-lint
        timeout-minutes: 20
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
