name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        timeout-minutes: 10
        with:
          go-version-file: go.mod

      - name: Download modules
        timeout-minutes: 10
        run: go mod download

      # The remux test skips without ffmpeg; CI should run it.
      # apt-get hung past the step timeout on the runner, even with short network
      # timeouts, so a static build comes from GitHub instead. Dated BtbN builds
      # are pruned; the release-branch file in "latest" stays put.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          name=ffmpeg-n9.0-latest-linux64-gpl-9.0
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 -O "$base/$name.tar.xz" -O "$base/checksums.sha256"
          grep " $name.tar.xz\$" checksums.sha256 | sha256sum -c -
          tar -xJf "$name.tar.xz"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
          "$name/bin/ffmpeg" -version | head -1

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::unformatted files:"; echo "$out"; exit 1; fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  # Lint and govulncheck don't wait for the tests: a runner of their own.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        timeout-minutes: 10
        with:
          go-version-file: go.mod

      - name: Download modules
        timeout-minutes: 10
        run: go mod download

      # Keep the version equal to the Makefile's: a new release brings new findings unasked.
      - name: golangci-lint
        timeout-minutes: 20
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
